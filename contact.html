<h1>Contact Me</h1>
<form>
<fieldset><legend>Personal Information</legend>
<label for="fullname">Full Name</label><input type="text" id="fullname" name="fullname" placeholder="Joseph Kimani" required>
<label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required>
<label for="phone">Phone</label><input type="tel" id="phone" name="phone" placeholder="+254 700 000000">
<label for="subject">Subject</label><select id="subject" name="subject"><option value="">Choose a subject</option><option value="collab">Collaboration</option><option value="job">Job Opportunity</option><option value="feedback">Feedback</option></select>
</fieldset>
<fieldset><legend>Your Message</legend>
<label for="message">Message (min 50 chars)</label><textarea id="message" name="message" placeholder="Write your message here..." required minlength="50" rows="5"></textarea>
<label><input type="checkbox" name="newsletter"> Subscribe to my newsletter</label>
</fieldset>
<button type="submit">Send Message</button>
</form>
